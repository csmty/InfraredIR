exp: 
  backbone: mit_b3 # You can download the mit_b3.pth pretrained weights from https://drive.google.com/file/d/1JucexV7uFfeAOETdB8EJ62YDxu7tNfRx/view?usp=sharing

dataset:
  root_dir: /data/matengyu/students/daizhilong/data/Fusion_task/__Ours_task/FMB
  num_classes: 15  # https://github.com/JinyuanLiu-CV/SegMiF/issues/24
  crop_size: 512
  resize_range: [512, 2048]
  rescale_range: [0.5, 2.0]
  ignore_index: 255

train:
  split: train
  samples_per_gpu: 4
  # max_iters: 40000
  max_iters: 80000
  eval_iters: 2000
  log_iters: 50

val:
  split: val

optimizer:
  type: AdamW
  learning_rate: 6e-5
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  warmup_iter: 1500
  warmup_ratio: 1e-6
  power: 1.0 